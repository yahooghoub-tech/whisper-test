<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>حضور و غیاب 3-سوم</title>

<link rel="stylesheet" href="attendance-3-3.css">
</head>

<body>

<div class="container">

    <div class="header">

        <div class="header-icon">📋</div>

        <div class="header-content">
            <h1>حضور و غیاب کلاس 3-سوم</h1>
            <div class="date" id="todayDate"></div>
        </div>

    </div>


    <div class="summary">

        <div class="summary-box total">
            <span class="summary-title">تعداد دانش‌آموزان</span>
            <strong id="totalCount">23</strong>
        </div>

        <div class="summary-box present">
            <span class="summary-title">حاضر</span>
            <strong id="presentCount">23</strong>
        </div>

        <div class="summary-box absent">
            <span class="summary-title">غایب</span>
            <strong id="absentCount">0</strong>
        </div>

    </div>


    <div class="instruction">
        روی نام دانش‌آموز غایب کلیک کنید.
        برای برگرداندن وضعیت به حاضر، دوباره روی همان دکمه کلیک کنید.
    </div>


    <div id="studentsContainer" class="students-container"></div>


    <div id="message" class="message"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="attendance-3-3.js"></script>
<div class="call-panel-button-container">
    <button id="callPanelButton" type="button" onclick="goToCallPanel()">
        📢
        <span>ورود به پنل فراخوان</span>
    </button>
</div>

<script>
function goToCallPanel() {
    window.location.href = "teacher-3-3.html";
}
</script>
</body>
</html>
