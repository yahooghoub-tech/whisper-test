<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>فراخوان دانش‌آموزان</title>
<link rel="stylesheet" href="click.css">
</head>
<body>
<div class="container">
<div class="top-bar">
<h1>📢 سیستم فراخوان دانش‌آموزان</h1>
<div class="search-box">
<input id="searchInput" type="text" placeholder="جستجوی نام و نام خانوادگی...">
</div>
<button id="resetCalls" class="reset-button">🗑 حذف تمام فراخوان‌ها</button>
</div>
<div id="classesContainer"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="click.js"></script>

<div id="teacherSendPopup" class="teacher-send-popup">
    <div class="teacher-send-popup-icon">📤</div>
    <div class="teacher-send-popup-content">
        <div class="teacher-send-popup-title">ارسال دانش‌آموز</div>
        <div id="teacherSendPopupText" class="teacher-send-popup-text"></div>
    </div>
    <button id="closeTeacherSendPopup" class="teacher-send-popup-close">×</button>
</div>


</body>
</html>
