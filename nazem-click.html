<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>فراخوان دانش‌آموزان</title>

<link rel="stylesheet" href="click.css">


<!-- =====================================================
     سیستم ورود ناظم
===================================================== -->

<style>

#nazemLoginPage{

position:fixed;

inset:0;

z-index:999999;

display:flex;

align-items:center;

justify-content:center;

padding:20px;

background:
linear-gradient(
135deg,
#0f172a,
#172554,
#1e3a8a
);

font-family:
Tahoma,
Arial,
sans-serif;
}


#nazemLoginPage.hidden{

display:none;

}


.nazem-login-card{

width:100%;

max-width:430px;

background:rgba(255,255,255,.97);

border-radius:28px;

padding:35px 30px;

box-shadow:
0 25px 70px rgba(0,0,0,.35);

text-align:center;

}


.nazem-login-icon{

width:80px;

height:80px;

margin:0 auto 18px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:38px;

background:
linear-gradient(
135deg,
#2563eb,
#1d4ed8
);

box-shadow:
0 10px 30px
rgba(37,99,235,.35);

}


.nazem-login-card h1{

font-size:25px;

color:#0f172a;

margin-bottom:10px;

}


.nazem-login-subtitle{

font-size:14px;

color:#64748b;

margin-bottom:28px;

line-height:1.8;

}


.nazem-input-group{

text-align:right;

margin-bottom:18px;

}


.nazem-input-group label{

display:block;

font-size:14px;

font-weight:bold;

color:#334155;

margin-bottom:8px;

}


.nazem-input-group input{

width:100%;

height:52px;

border:
2px solid #e2e8f0;

border-radius:14px;

padding:0 15px;

font-family:
Tahoma,
Arial,
sans-serif;

font-size:15px;

outline:none;

transition:.25s;

background:#f8fafc;

}


.nazem-input-group input:focus{

border-color:#2563eb;

background:#fff;

box-shadow:
0 0 0 4px
rgba(37,99,235,.1);

}


.nazem-password-wrapper{

position:relative;

}


.nazem-password-wrapper input{

padding-left:52px;

}


#nazemTogglePassword{

position:absolute;

left:7px;

top:7px;

width:38px;

height:38px;

border:0;

border-radius:10px;

background:#e2e8f0;

cursor:pointer;

font-size:18px;

}


#nazemLoginButton{

width:100%;

height:54px;

border:0;

border-radius:15px;

background:
linear-gradient(
135deg,
#2563eb,
#1d4ed8
);

color:#fff;

font-family:
Tahoma,
Arial,
sans-serif;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.25s;

margin-top:5px;

box-shadow:
0 10px 25px
rgba(37,99,235,.25);

}


#nazemLoginButton:hover{

transform:translateY(-2px);

box-shadow:
0 14px 30px
rgba(37,99,235,.35);

}


#nazemLoginButton.loading{

opacity:.7;

pointer-events:none;

}


#nazemLoginError{

min-height:25px;

font-size:13px;

font-weight:bold;

color:#dc2626;

margin-bottom:5px;

line-height:1.7;

}


.nazem-login-footer{

margin-top:25px;

padding-top:18px;

border-top:
1px solid #e2e8f0;

font-size:12px;

color:#94a3b8;

}


@media(max-width:600px){

#nazemLoginPage{

padding:15px;

}


.nazem-login-card{

max-width:100%;

padding:30px 22px;

border-radius:24px;

}


.nazem-login-icon{

width:70px;

height:70px;

font-size:34px;

}


.nazem-login-card h1{

font-size:22px;

}


.nazem-login-subtitle{

font-size:13px;

margin-bottom:24px;

}


.nazem-input-group input{

height:50px;

font-size:14px;

}


#nazemLoginButton{

height:52px;

font-size:15px;

}

}
/* =========================================
   اعلان کوچک شیشه‌ای پایین صفحه ناظم
========================================= */

.teacher-send-popup{
    position:fixed !important;

    left:50% !important;
    bottom:calc(12px + env(safe-area-inset-bottom)) !important;
    top:auto !important;
    right:auto !important;

    width:calc(100vw - 28px) !important;
    max-width:340px !important;

    box-sizing:border-box;

    padding:9px 12px;

    display:flex;
    align-items:center;

    gap:9px;

    direction:rtl;

    background:rgba(20,25,35,.72);

    border:1px solid rgba(255,255,255,.22);

    border-radius:16px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.18);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    opacity:0;
    visibility:hidden;

    pointer-events:none;

    transform:
        translate(-50%,calc(100% + 25px))
        !important;

    transition:
        opacity .3s ease,
        transform .35s cubic-bezier(.22,1,.36,1);

    z-index:2147483647 !important;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    overflow:hidden;
}


/* نمایش اعلان */

.teacher-send-popup.show{

    opacity:1 !important;

    visibility:visible !important;

    pointer-events:none !important;

    transform:
        translate(-50%,0)
        !important;
}


/* آیکون */

.teacher-send-popup-icon{

    width:32px;
    height:32px;

    min-width:32px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(34,197,94,.85);

    box-shadow:
        0 0 12px rgba(34,197,94,.3);

    font-size:16px;

    overflow:hidden;
}


/* محتوای اعلان */

.teacher-send-popup-content{

    min-width:0;

    flex:1;

    overflow:hidden;

    text-align:right;
}


/* عنوان */

.teacher-send-popup-title{

    font-size:12px;

    font-weight:900;

    color:#fff;

    margin-bottom:1px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* متن */

.teacher-send-popup-text{

    font-size:9px;

    line-height:1.6;

    color:rgba(255,255,255,.82);

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* اسم دانش آموز */

.teacher-send-popup-text strong{

    color:#ffd740;

    font-weight:900;
}


/* دکمه بستن مخفی */

.teacher-send-popup-close{

    display:none !important;
}


/* =========================================
   موبایل
========================================= */

@media(max-width:600px){

    .teacher-send-popup{

        width:calc(100vw - 24px) !important;

        max-width:330px !important;

        bottom:
            calc(10px + env(safe-area-inset-bottom))
            !important;

        padding:8px 10px;

        border-radius:15px;

        gap:8px;
    }


    .teacher-send-popup-icon{

        width:30px;
        height:30px;

        min-width:30px;

        font-size:15px;
    }


    .teacher-send-popup-title{

        font-size:11px;
    }


    .teacher-send-popup-text{

        font-size:9px;

        line-height:1.5;
    }

}


/* =========================================
   تبلت
========================================= */

@media(min-width:601px) and (max-width:1024px){

    .teacher-send-popup{

        width:330px !important;

        max-width:330px !important;

        bottom:
            calc(14px + env(safe-area-inset-bottom))
            !important;
    }

}


/* =========================================
   دسکتاپ
========================================= */

@media(min-width:1025px){

    .teacher-send-popup{

        width:340px !important;

        max-width:340px !important;

        bottom:18px !important;
    }

}
</style>

</head>


<body>


<!-- =====================================================
     صفحه ورود
===================================================== -->

<div id="nazemLoginPage">


<div class="nazem-login-card">


<div class="nazem-login-icon">
🔐
</div>


<h1>
ورود به پنل ناظم
</h1>


<p class="nazem-login-subtitle">
سیستم مدیریت فراخوان دانش‌آموزان
</p>


<form id="nazemLoginForm">


<div class="nazem-input-group">

<label for="nazemUsername">
نام کاربری
</label>

<input
id="nazemUsername"
type="text"
autocomplete="username"
placeholder="نام کاربری را وارد کنید"
>

</div>


<div class="nazem-input-group">

<label for="nazemPassword">
رمز عبور
</label>


<div class="nazem-password-wrapper">


<input
id="nazemPassword"
type="password"
autocomplete="current-password"
placeholder="رمز عبور را وارد کنید"
>


<button
type="button"
id="nazemTogglePassword"
>
👁️
</button>


</div>

</div>


<div
id="nazemLoginError"
>
</div>


<button
type="submit"
id="nazemLoginButton"
>
ورود به پنل
</button>


</form>


<div class="nazem-login-footer">
📢 سیستم فراخوان مدرسه
</div>


</div>

</div>



<!-- =====================================================
     پنل اصلی ناظم
     ساختار فعلی تو بدون تغییر
===================================================== -->

<div
id="nazemPanel"
style="display:none;"
>


<div class="container">


<div class="top-bar">


<h1>
📢 سیستم فراخوان دانش‌آموزان
</h1>


<div class="search-box">

<input
id="searchInput"
type="text"
placeholder="جستجوی نام و نام خانوادگی..."
>

</div>


<button
id="resetCalls"
class="reset-button"
>
🗑 حذف تمام فراخوان‌ها
</button>


</div>


<div id="classesContainer"></div>


</div>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script src="click.js"></script>
<audio id="teacherSendSound" src="notification.mp3" preload="auto"></audio>

<div
id="teacherSendPopup"
class="teacher-send-popup"
>


<div
class="teacher-send-popup-icon walking-person"
>


<div class="person">

<div class="head"></div>

<div class="body"></div>

<div class="arm arm-left"></div>

<div class="arm arm-right"></div>

<div class="leg leg-left"></div>

<div class="leg leg-right"></div>

</div>


</div>


<div class="teacher-send-popup-content">


<div
class="teacher-send-popup-title"
>
ارسال دانش‌آموز
</div>


<div
id="teacherSendPopupText"
class="teacher-send-popup-text"
>
</div>


</div>


<button
id="closeTeacherSendPopup"
class="teacher-send-popup-close"
>
×
</button>


</div>


</div>



<!-- =====================================================
     JavaScript ورود
===================================================== -->

<script>

const NAZEM_USERNAME = "nazem";

const NAZEM_PASSWORD = "1313";


const nazemLoginPage =
document.getElementById(
"nazemLoginPage"
);

const nazemPanel =
document.getElementById(
"nazemPanel"
);

const nazemLoginForm =
document.getElementById(
"nazemLoginForm"
);

const nazemUsername =
document.getElementById(
"nazemUsername"
);

const nazemPassword =
document.getElementById(
"nazemPassword"
);

const nazemLoginError =
document.getElementById(
"nazemLoginError"
);

const nazemLoginButton =
document.getElementById(
"nazemLoginButton"
);

const nazemTogglePassword =
document.getElementById(
"nazemTogglePassword"
);


/* =====================================================
   بررسی ورود قبلی
===================================================== */

if(
sessionStorage.getItem(
"nazemLoggedIn"
) === "true"
){

nazemLoginPage.classList.add(
"hidden"
);

nazemPanel.style.display =
"block";

}


/* =====================================================
   نمایش / مخفی کردن رمز
===================================================== */

nazemTogglePassword.addEventListener(
"click",
function(){

if(
nazemPassword.type === "password"
){

nazemPassword.type =
"text";

nazemTogglePassword.textContent =
"🙈";

}else{

nazemPassword.type =
"password";

nazemTogglePassword.textContent =
"👁️";

}

}
);


/* =====================================================
   ورود ناظم
===================================================== */

nazemLoginForm.addEventListener(
"submit",
function(event){

event.preventDefault();


const username =
nazemUsername.value.trim();

const password =
nazemPassword.value;


nazemLoginError.textContent =
"";


if(
!username ||
!password
){

nazemLoginError.textContent =
"لطفاً نام کاربری و رمز عبور را وارد کنید.";

return;

}


if(
username === NAZEM_USERNAME &&
password === NAZEM_PASSWORD
){

nazemLoginButton.textContent =
"در حال ورود...";

nazemLoginButton.classList.add(
"loading"
);


/* ثبت ورود */

sessionStorage.setItem(
"nazemLoggedIn",
"true"
);

sessionStorage.setItem(
"nazemLoginTime",
Date.now().toString()
);


/* نمایش پنل */

setTimeout(
function(){

nazemLoginPage.classList.add(
"hidden"
);

nazemPanel.style.display =
"block";

nazemLoginButton.textContent =
"ورود به پنل";

nazemLoginButton.classList.remove(
"loading"
);

},
300
);


}else{


nazemLoginError.textContent =
"❌ نام کاربری یا رمز عبور اشتباه است.";

nazemPassword.value = "";

nazemPassword.focus();

}

}
);

</script>

<div id="teacherSendPopup" class="teacher-send-popup">
     <div class="teacher-send-popup-box">
     <div class="teacher-send-popup-icon">📢</div>
     <div class="teacher-send-popup-title">ارسال دانش‌آموز</div>
     <div id="teacherSendPopupText" class="teacher-send-popup-text"></div>
     <button id="closeTeacherSendPopup" type="button">باشه</button>
     </div>
     </div>
</body>

</html>
