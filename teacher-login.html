<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>ورود معلم</title>


<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,
body{
width:100%;
min-height:100%;
}

body{

font-family:
Tahoma,
Arial,
sans-serif;

background:
linear-gradient(
135deg,
#0f172a,
#064e3b,
#047857
);

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:20px;
}


.login-page{

width:100%;

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;
}


.login-card{

width:100%;

max-width:430px;

background:
rgba(255,255,255,.97);

border-radius:28px;

padding:35px 30px;

box-shadow:
0 25px 70px
rgba(0,0,0,.35);

text-align:center;
}


.login-icon{

width:80px;

height:80px;

margin:
0 auto 18px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:38px;

background:
linear-gradient(
135deg,
#059669,
#047857
);

box-shadow:
0 10px 30px
rgba(5,150,105,.35);
}


.login-card h1{

font-size:25px;

color:#0f172a;

margin-bottom:10px;
}


.login-subtitle{

font-size:14px;

color:#64748b;

margin-bottom:28px;

line-height:1.8;
}


.input-group{

text-align:right;

margin-bottom:18px;
}


.input-group label{

display:block;

font-size:14px;

font-weight:bold;

color:#334155;

margin-bottom:8px;
}


.input-group input{

width:100%;

height:52px;

border:
2px solid #e2e8f0;

border-radius:14px;

padding:0 15px;

font-family:
Tahoma,
Arial,
sans-serif;

font-size:15px;

outline:none;

transition:.25s;

background:#f8fafc;
}


.input-group input:focus{

border-color:#059669;

background:#fff;

box-shadow:
0 0 0 4px
rgba(5,150,105,.1);
}


.password-wrapper{

position:relative;
}


.password-wrapper input{

padding-left:52px;
}


#togglePassword{

position:absolute;

left:7px;

top:7px;

width:38px;

height:38px;

border:0;

border-radius:10px;

background:#e2e8f0;

cursor:pointer;

font-size:18px;
}


.login-button{

width:100%;

height:54px;

border:0;

border-radius:15px;

background:
linear-gradient(
135deg,
#059669,
#047857
);

color:#fff;

font-family:
Tahoma,
Arial,
sans-serif;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.25s;

margin-top:5px;

box-shadow:
0 10px 25px
rgba(5,150,105,.25);
}


.login-button:hover{

transform:
translateY(-2px);

box-shadow:
0 14px 30px
rgba(5,150,105,.35);
}


.login-button:active{

transform:
translateY(0);
}


.login-button.loading{

opacity:.7;

pointer-events:none;
}


.login-error{

min-height:25px;

font-size:13px;

font-weight:bold;

color:#dc2626;

margin-bottom:5px;

line-height:1.7;
}


.login-footer{

margin-top:25px;

padding-top:18px;

border-top:
1px solid #e2e8f0;

font-size:12px;

color:#94a3b8;
}


@media(max-width:600px){

body{

padding:15px;
}


.login-page{

min-height:
calc(100vh - 30px);
}


.login-card{

max-width:100%;

padding:
30px 22px;

border-radius:24px;
}


.login-icon{

width:70px;

height:70px;

font-size:34px;
}


.login-card h1{

font-size:22px;
}


.login-subtitle{

font-size:13px;

margin-bottom:24px;
}


.input-group input{

height:50px;

font-size:14px;
}


.login-button{

height:52px;

font-size:15px;
}

}

</style>

</head>


<body>


<div class="login-page">


<div class="login-card">


<div class="login-icon">
👨‍🏫
</div>


<h1>
ورود معلم
</h1>


<p class="login-subtitle">
سامانه فراخوان دانش‌آموزان دبستان علوی
</p>


<form id="loginForm">


<div class="input-group">

<label for="username">
نام کاربری
</label>

<input
id="username"
type="text"
autocomplete="username"
placeholder="نام کاربری را وارد کنید"
>

</div>


<div class="input-group">

<label for="password">
رمز عبور
</label>


<div class="password-wrapper">


<input
id="password"
type="password"
autocomplete="current-password"
placeholder="رمز عبور کلاس را وارد کنید"
>


<button
type="button"
id="togglePassword"
>
👁️
</button>


</div>

</div>


<div
id="loginError"
class="login-error">
</div>


<button
type="submit"
class="login-button"
id="loginButton"
>
ورود به پنل کلاس
</button>


</form>


<div class="login-footer">
📚 پنل اختصاصی معلم
</div>


</div>

</div>


<script>


/* ==================================================
   نام کاربری مشترک تمام معلم‌ها
================================================== */

const TEACHER_USERNAME = "alavi";


/* ==================================================
   رمز و پنل هر کلاس
================================================== */

const TEACHERS = {

    /* =========================
       پایه اول
    ========================= */

    "1101":{
        className:"اول-1",
        panel:"teacher-1-1.html"
    },

    "1102":{
        className:"اول-2",
        panel:"teacher-1-2.html"
    },

    "1103":{
        className:"اول-3",
        panel:"teacher-1-3.html"
    },


    /* =========================
       پایه دوم
    ========================= */

    "2101":{
        className:"دوم-1",
        panel:"teacher-2-1.html"
    },

    "2102":{
        className:"دوم-2",
        panel:"teacher-2-2.html"
    },


    /* =========================
       پایه سوم
    ========================= */

    "3101":{
        className:"سوم-1",
        panel:"teacher-3-1.html"
    },

    "3102":{
        className:"سوم-2",
        panel:"teacher-3-2.html"
    },

    "3103":{
        className:"سوم-3",
        panel:"teacher-3-3.html"
    },


    /* =========================
       پایه چهارم
    ========================= */

    "4101":{
        className:"چهارم-1",
        panel:"teacher-4-1.html"
    },

    "4102":{
        className:"چهارم-2",
        panel:"teacher-4-2.html"
    },

    "4103":{
        className:"چهارم-3",
        panel:"teacher-4-3.html"
    },


    /* =========================
       پایه پنجم
    ========================= */

    "5101":{
        className:"پنجم-1",
        panel:"teacher-5-1.html"
    },

    "5102":{
        className:"پنجم-2",
        panel:"teacher-5-2.html"
    },

    "5103":{
        className:"پنجم-3",
        panel:"teacher-5-3.html"
    },


    /* =========================
       پایه ششم
    ========================= */

    "6101":{
        className:"ششم-1",
        panel:"teacher-6-1.html"
    },

    "6102":{
        className:"ششم-2",
        panel:"teacher-6-2.html"
    }

};


/* ==================================================
   عناصر صفحه
================================================== */

const loginForm =
document.getElementById("loginForm");

const usernameInput =
document.getElementById("username");

const passwordInput =
document.getElementById("password");

const loginError =
document.getElementById("loginError");

const togglePassword =
document.getElementById("togglePassword");

const loginButton =
document.getElementById("loginButton");


/* ==================================================
   نمایش / مخفی کردن رمز
================================================== */

togglePassword.addEventListener(
"click",
()=>{

if(
passwordInput.type === "password"
){

passwordInput.type = "text";

togglePassword.textContent =
"🙈";

}else{

passwordInput.type = "password";

togglePassword.textContent =
"👁️";

}

}
);


/* ==================================================
   ورود معلم
================================================== */

loginForm.addEventListener(
"submit",
(event)=>{

event.preventDefault();


const username =
usernameInput.value.trim();

const password =
passwordInput.value.trim();


/* پاک کردن خطای قبلی */

loginError.textContent = "";


/* =========================
   بررسی نام کاربری
========================= */

if(
username !== TEACHER_USERNAME
){

loginError.textContent =
"❌ نام کاربری یا رمز عبور اشتباه است.";

passwordInput.value = "";

return;

}


/* =========================
   پیدا کردن کلاس از روی رمز
========================= */

const teacher =
TEACHERS[password];


if(!teacher){

loginError.textContent =
"❌ نام کاربری یا رمز عبور اشتباه است.";

passwordInput.value = "";

passwordInput.focus();

return;

}


/* =========================
   ورود موفق
========================= */

loginButton.textContent =
"در حال ورود...";

loginButton.classList.add(
"loading"
);


/* =========================
   ذخیره اطلاعات ورود
========================= */

sessionStorage.setItem(
"teacherLoggedIn",
"true"
);

sessionStorage.setItem(
"teacherClass",
teacher.className
);

sessionStorage.setItem(
"teacherPassword",
password
);

sessionStorage.setItem(
"teacherPanel",
teacher.panel
);

sessionStorage.setItem(
"teacherLoginTime",
Date.now().toString()
);


/* =========================
   انتقال به پنل کلاس
========================= */

setTimeout(
()=>{

window.location.replace(
teacher.panel
);

},
300
);

});

</script>


</body>

</html>
