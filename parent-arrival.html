
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل ثبت حضور | دبستان علوی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,sans-serif;background:#f1f5f9;color:#172033}
header{background:linear-gradient(135deg,#123c70,#2563eb);color:white;padding:24px 15px;text-align:center}
header h1{font-size:22px;margin:0 0 8px}
header p{margin:0;font-size:14px}
.container{max-width:850px;margin:24px auto;padding:0 14px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
button{font-family:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:12px 15px}
.back{background:#e2e8f0;color:#1e293b}
#connection{font-size:13px;color:#64748b}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:white;border-radius:15px;padding:16px;box-shadow:0 4px 16px #0f172a0b}
.stat span{display:block;color:#64748b;font-size:13px}
.stat strong{display:block;font-size:25px;margin-top:5px}
#notice{background:white;border-radius:12px;padding:12px;margin-bottom:14px;font-size:13px;line-height:1.9;overflow-wrap:anywhere}
#notice.error{background:#fee2e2;color:#991b1b}
.list{display:grid;gap:11px}
.student{background:white;border:1px solid #e2e8f0;border-radius:15px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.name{font-weight:700;font-size:15px}
.meta{font-size:12px;color:#64748b;margin-top:5px}
.arrived{color:#15803d}
.register{background:#2563eb;color:white;min-width:105px}
.register:disabled{opacity:.65;cursor:wait}
.register.done{background:#dcfce7;color:#166534}
footer{text-align:center;color:#94a3b8;font-size:12px;padding:28px 10px}
@media(max-width:480px){
 header h1{font-size:19px}
 .student{align-items:flex-start}
 .register{min-width:88px;padding:10px 8px;font-size:12px}
 .name{font-size:13px}
}
</style>
</head>
<body>
<header>
<h1>📣 پنل ثبت حضور دانش‌آموزان</h1>
<p id="classTitle">در حال تشخیص کلاس...</p>
</header>

<main class="container">
<div class="toolbar">
<button class="back" id="backButton">↩ بازگشت به پنل اصلی</button>
<span id="connection">در حال اتصال...</span>
</div>

<div class="summary">
<div class="stat"><span>تعداد دانش‌آموزان</span><strong id="totalCount">۰</strong></div>
<div class="stat"><span>حضور ثبت‌شده امروز</span><strong id="arrivedCount">۰</strong></div>
</div>

<div id="notice" role="status">در حال دریافت فهرست دانش‌آموزان...</div>
<div id="studentsList" class="list"></div>
</main>

<footer>سامانه ثبت حضور دبستان علوی</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ghnpiijihybuhfetnxjp.supabase.co";
const SUPABASE_KEY = "sb_publishable_SEGca8-w1pAO3_TQgMd-qA_vOvkj6jq";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const teacherClasses = {
    "پیش-1": "attendance-pre-1.html",
    "پیش-2": "attendance-pre-2.html",
    "اول-1": "teacher-1-1.html",
    "اول-2": "teacher-1-2.html",
    "اول-3": "teacher-1-3.html",
    "دوم-1": "teacher-2-1.html",
    "دوم-2": "teacher-2-2.html",
    "سوم-1": "teacher-3-1.html",
    "سوم-2": "teacher-3-2.html",
    "سوم-3": "teacher-3-3.html",
    "چهارم-1": "teacher-4-1.html",
    "چهارم-2": "teacher-4-2.html",
    "چهارم-3": "teacher-4-3.html",
    "پنجم-1": "teacher-5-1.html",
    "پنجم-2": "teacher-5-2.html",
    "پنجم-3": "teacher-5-3.html",
    "ششم-1": "teacher-6-1.html",
    "ششم-2": "teacher-6-2.html"
};

const className = sessionStorage.getItem("teacherClass");
const validClass = Object.prototype.hasOwnProperty.call(
    teacherClasses, className
);

const list = document.getElementById("studentsList");
const notice = document.getElementById("notice");
const connection = document.getElementById("connection");
const arrivals = new Map();
const students = new Map();
const pending = new Set();

let realtimeChannel = null;

function localDate() {
    const d = new Date();
    return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, "0"),
        String(d.getDate()).padStart(2, "0")
    ].join("-");
}

function showNotice(message, error = false) {
    notice.textContent = message;
    notice.classList.toggle("error", error);
}

function formatTime(value) {
    return new Date(value).toLocaleTimeString("fa-IR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    });
}

function renderStudents() {
    list.replaceChildren();

    const names = [...students.keys()].sort((a, b) =>
        a.localeCompare(b, "fa")
    );

    names.forEach(name => {
        const record = arrivals.get(name);
        const card = document.createElement("div");
        card.className = "student";

        const info = document.createElement("div");
        const nameElement = document.createElement("div");
        nameElement.className = "name";
        nameElement.textContent = name;

        const meta = document.createElement("div");
        meta.className = "meta";

        const button = document.createElement("button");
        button.type = "button";
        button.className = "register";

        if (record) {
            meta.className = "meta arrived";
            meta.textContent = "✓ حاضر در مدرسه · ساعت " +
                formatTime(record.arrived_at);

            button.className = "register done";
            button.textContent = "✓ ثبت شد";
            button.disabled = true;
        } else if (pending.has(name)) {
            meta.textContent = "در حال ثبت حضور...";
            button.textContent = "در حال ثبت";
            button.disabled = true;
        } else {
            meta.textContent = "هنوز حضور ثبت نشده";
            button.textContent = "ثبت حضور";
            button.addEventListener("click", () => registerArrival(name));
        }

        info.append(nameElement, meta);
        card.append(info, button);
        list.appendChild(card);
    });

    document.getElementById("totalCount").textContent =
        names.length.toLocaleString("fa-IR");

    document.getElementById("arrivedCount").textContent =
        arrivals.size.toLocaleString("fa-IR");
}

async function loadStudents() {
    const { data, error } = await client
        .from("students")
        .select("name,class_name")
        .eq("class_name", className);

    if (error) {
        showNotice(
            "دریافت اسامی ناموفق بود. ساختار جدول students و مجوزهای دسترسی را بررسی کنید: " +
            error.message,
            true
        );
        return false;
    }

    students.clear();

    (data || []).forEach(student => {
        if (student.name) students.set(student.name, student);
    });

    renderStudents();

    if (!students.size) {
        showNotice(
            "برای این کلاس دانش‌آموزی پیدا نشد. مقدار class_name در جدول students را بررسی کنید.",
            true
        );
        return false;
    }

    return true;
}

async function loadArrivals() {
    const { data, error } = await client
        .from("class_arrivals")
        .select("student_name,class_name,arrival_date,arrived_at")
        .eq("class_name", className)
        .eq("arrival_date", localDate());

    if (error) {
        showNotice(
            "دریافت وضعیت حضور ناموفق بود. مجوزهای جدول class_arrivals را بررسی کنید: " +
            error.message,
            true
        );
        return false;
    }

    arrivals.clear();

    (data || []).forEach(record => {
        if (students.has(record.student_name)) {
            arrivals.set(record.student_name, record);
        }
    });

    renderStudents();
    return true;
}

async function registerArrival(name) {
    if (!students.has(name) || arrivals.has(name) || pending.has(name)) {
        return;
    }

    pending.add(name);
    renderStudents();
    showNotice("در حال ثبت حضور " + name + "...");

    const { data, error } = await client
        .from("class_arrivals")
        .insert({
            student_name: name,
            class_name: className,
            arrival_date: localDate()
        })
        .select("student_name,class_name,arrival_date,arrived_at")
        .single();

    pending.delete(name);

    if (error) {
        if (error.code === "23505") {
            await loadArrivals();
            showNotice("حضور این دانش‌آموز قبلاً ثبت شده است.");
            return;
        }

        renderStudents();
        showNotice(
            "ثبت حضور انجام نشد. مجوزهای امن دیتابیس را بررسی کنید: " +
            error.message,
            true
        );
        return;
    }

    arrivals.set(name, data);
    renderStudents();
    showNotice("حضور " + name + " با موفقیت ثبت شد.");
}

function connectRealtime() {
    if (realtimeChannel) {
        client.removeChannel(realtimeChannel);
    }

    realtimeChannel = client
        .channel("arrival-" + encodeURIComponent(className))
        .on("postgres_changes", {
            event: "*",
            schema: "public",
            table: "class_arrivals",
            filter: "class_name=eq." + className
        }, async payload => {
            const record = payload.new;

            if (payload.eventType === "DELETE") {
                await loadArrivals();
                showNotice("وضعیت حضور به‌روزرسانی شد.");
                return;
            }

            if (record && record.arrival_date === localDate()) {
                await loadArrivals();
                showNotice("تغییر جدید دریافت شد؛ وضعیت حضور به‌روز است.");
            }
        })
        .subscribe(status => {
            if (status === "SUBSCRIBED") {
                connection.textContent = "🟢 اتصال زنده برقرار است";
                loadArrivals();
            } else if (
                status === "CHANNEL_ERROR" ||
                status === "TIMED_OUT" ||
                status === "CLOSED"
            ) {
                connection.textContent = "🔴 اتصال زنده قطع است";
            } else {
                connection.textContent = "در حال اتصال...";
            }
        });
}

document.getElementById("backButton").addEventListener("click", () => {
    window.location.href = teacherClasses[className];
});

async function start() {
    if (!validClass) {
        connection.textContent = "کلاس مشخص نیست";
        showNotice(
            "اطلاعات کلاس معلم پیدا نشد. ابتدا از صفحه ورود معلمان وارد شوید.",
            true
        );
        return;
    }

    document.getElementById("classTitle").textContent =
        "دبستان علوی | کلاس " + className;

    const loaded = await loadStudents();
    if (!loaded) return;

    await loadArrivals();
    connectRealtime();

    // نیمه‌شب، تاریخ روز عوض می‌شود و وضعیت امروز دوباره بارگذاری می‌شود.
    setInterval(async () => {
        await loadArrivals();
    }, 60000);
}

start();
</script>
</body>
</html>
