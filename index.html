<!-- index.html -->

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>تست Vosk فارسی</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111827;
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.container{
width:min(700px,92%);
background:#1f2937;
padding:30px;
border-radius:20px;
text-align:center;
}

button{
padding:14px 25px;
margin:5px;
border:0;
border-radius:10px;
font-size:18px;
cursor:pointer;
background:#2563eb;
color:white;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

#status{
margin:20px 0;
font-size:18px;
}

#result{
background:#111827;
padding:20px;
border-radius:10px;
min-height:100px;
font-size:24px;
line-height:2;
}
</style>
</head>

<body>

<div class="container">

<h1>🎙️ تست Vosk فارسی</h1>

<button id="startBtn">
شروع میکروفون
</button>

<button id="stopBtn">
توقف
</button>

<div id="status">
در حال آماده‌سازی...
</div>

<div id="result">
متن اینجا نمایش داده می‌شود
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
<script src="app.js"></script>

</body>
</html>
