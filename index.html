
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>تست شنیدن مداوم</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#101827;
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.container{
width:min(650px,92%);
background:#172235;
padding:30px;
border-radius:20px;
text-align:center;
}

h1{
margin-top:0;
}

button{
border:0;
padding:15px 25px;
border-radius:12px;
font-size:18px;
cursor:pointer;
background:#2563eb;
color:white;
margin:5px;
}

button.stop{
background:#dc2626;
}

button:disabled{
opacity:.5;
}

#status{
margin-top:25px;
font-size:18px;
}

#result{
margin-top:20px;
padding:20px;
min-height:120px;
background:#0f172a;
border-radius:12px;
font-size:22px;
line-height:2;
text-align:right;
}

.item{
padding:10px;
border-bottom:1px solid #334155;
}
</style>
</head>

<body>

<div class="container">

<h1>🎙️ تست شنیدن مداوم</h1>

<p>
سیستم را روشن کن و چند اسم را پشت سر هم بگو.
</p>

<button id="startBtn">
🎙️ شروع شنیدن
</button>

<button id="stopBtn" class="stop" disabled>
⛔ توقف
</button>

<div id="status">
آماده
</div>

<div id="result">
هنوز چیزی تشخیص داده نشده
</div>

</div>

<script src="app.js"></script>

</body>
</html>
