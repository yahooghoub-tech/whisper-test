<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>پنل معلم 1-اول</title>
<link rel="stylesheet" href="teacher-1-1.css">
</head>
<body>
    <div id="callAlert" class="call-alert">

        <div class="call-alert-box">
        
        <div class="call-alert-icon">
        📢
        </div>
        
        <div class="call-alert-title">
        فراخوان جدید
        </div>
        
        <div id="callAlertStudent" class="call-alert-student">
        </div>
        
        <div class="call-alert-text">
        فراخوان شد
        </div>
        
        <button
        id="closeCallAlert"
        type="button">
        باشه
        </button>
        
        </div>
        
        </div>
<div class="container">
<div class="header">
<h1>📚 پنل کلاس 1-اول</h1>
        <div id="pushTestResult"></div>
<div class="class-info">
    <span>کلاس 1-اول</span>
    <span id="callCount">0 فراخوان</span>
    <button id="enableSoundButton" type="button">🔔 فعال‌سازی صدای فراخوان</button>
    </div>
</div>
<div id="studentsContainer" class="students-container"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="teacher-1-1.js"></script>
<div id="callPopup" class="call-popup">
    <div class="call-popup-icon">📢</div>
    <div class="call-popup-title">فراخوان جدید</div>
    <div id="callPopupStudent" class="call-popup-student"></div>
    <div class="call-popup-text">لطفاً اندرویدباکس را از برق بکشید  </div>
</div>
